<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071124"><title>星核守卫 · 星穹纪元 V13.0</title><style>:root{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;color:#edf5ff;background:#030a18;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}#app{min-height:100dvh;display:grid;place-items:center;padding:0;background:radial-gradient(ellipse at 4% 54%,#233764 0,transparent 43%),radial-gradient(ellipse at 96% 32%,#302b67 0,transparent 42%),radial-gradient(ellipse at 55% 75%,#0d2849,#030817 75%)}#stage{position:relative;width:min(100vw,calc(100dvh * 16 / 9));aspect-ratio:16/9;overflow:hidden;background:#081329;box-shadow:0 0 70px #000b}.home,.home-art,.panel{position:absolute;inset:0}.home-art{width:100%;height:100%;object-fit:cover}.hot{position:absolute;border:0;background:transparent;border-radius:14px;z-index:2}.hot:active{background:#b5e5ff44;box-shadow:inset 0 0 20px #9fe5ff}.hot:focus-visible{outline:3px solid #fff}.live-top{position:absolute;top:2%;left:39%;display:flex;gap:1.4vw;z-index:1;font-size:clamp(9px,1.5vw,22px);text-shadow:0 2px 5px black}.live-top span{padding:.3vw .9vw;border-radius:7px;background:#08172bbd;border:1px solid #6e9bc66e}.panel{background:radial-gradient(circle at 80% 0,#23467c,#081429 60%,#050b18);display:flex;flex-direction:column;z-index:5}.hidden{display:none!important}.panel-head{height:14%;min-height:55px;display:flex;align-items:center;gap:2%;padding:1% 2.5%;background:linear-gradient(90deg,#0b1c35dd,#182d50c7);border-bottom:1px solid #6cb8ef55}.panel-head h1{font-size:clamp(18px,2.4vw,32px);margin:0;text-shadow:0 0 14px #3b9fff}.eyebrow{font-size:clamp(8px,1vw,12px);letter-spacing:2px;color:#80c8ff}.back,.btn{border:1px solid #73baf5a6;color:#eaf6ff;border-radius:9px;background:linear-gradient(140deg,#17375d,#254c7a);padding:.6em 1em;font-weight:700}.btn.gold{background:linear-gradient(130deg,#8d4d1c,#edb75d);border-color:#ffe3a5;color:#271300}.btn.primary{background:linear-gradient(120deg,#137ab8,#564bc3);border-color:#8ad9ff}.btn:disabled{opacity:.45}.wallet{margin-left:auto;display:flex;gap:12px;font-size:clamp(10px,1.2vw,16px)}.panel-body{height:86%;overflow-y:auto;padding:2%;scrollbar-color:#416b96 transparent}.layout{display:grid;grid-template-columns:1fr 1fr;gap:2%;height:100%}.glass{background:linear-gradient(145deg,#1a3155d9,#101d36dd);border:1px solid #547bbd8c;border-radius:14px;padding:2%;box-shadow:inset 0 1px #b1dcff1c}.card-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.hero-card{border:1px solid #6b91c1;border-radius:12px;overflow:hidden;background:#101d35;color:white;padding:0;position:relative;text-align:left}.hero-card.active{outline:3px solid #ffc971}.hero-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.hero-card .info{padding:5px 8px;font-size:clamp(9px,1.05vw,15px)}.hero-card .rarity{position:absolute;top:5px;left:5px;background:#071629d9;padding:3px 6px;border-radius:5px;color:#ffd57f;font-size:11px}.portrait{width:100%;height:60%;object-fit:contain;object-position:center;filter:drop-shadow(0 0 20px #7a9dff55);animation:idle 3.2s ease-in-out infinite alternate}.portrait-frame{height:70%;overflow:hidden;background:radial-gradient(ellipse at center,#3b579a77,#080e24);border-radius:12px}.portrait-frame img{width:100%;height:100%;object-fit:contain;animation:idle 3s ease-in-out infinite alternate}@keyframes idle{0%{transform:translateY(4px) scale(1)}100%{transform:translateY(-5px) scale(1.025)}}.button-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.muted{color:#a9c3e2}.gold-text{color:#ffd17a}.stat{padding:7px;border-bottom:1px solid #41658b66}.pill{display:inline-block;background:#26496e;border:1px solid #6c9ac2;border-radius:30px;padding:4px 10px;margin:3px}.notice{padding:10px;border-left:3px solid #76cfff;background:#122746;margin:10px 0}.battle-layout{height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(180px,.72fr);gap:12px}.arena{width:100%;height:100%;max-height:100%;object-fit:contain;background:#0b1930;border:1px solid #537ca5;border-radius:12px;touch-action:manipulation}.battle-side{display:flex;flex-direction:column;gap:7px;overflow:auto}.battle-side .btn{font-size:clamp(10px,1.1vw,16px)}.battle-hud{font-size:clamp(10px,1.2vw,17px)}.slot-row{display:flex;flex-wrap:wrap;gap:6px}.slot{width:44px;height:44px;border:2px solid #577ba7;border-radius:8px;padding:0;overflow:hidden;background:#14233e;color:white}.slot img{width:100%;height:100%;object-fit:cover}.slot.active{border-color:#ffcb7a;box-shadow:0 0 10px #ffd47c}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #44658d66}.gacha-hero{width:clamp(120px,26vw,320px);aspect-ratio:1;object-fit:cover;border:3px solid #eac46e;border-radius:14px;box-shadow:0 0 35px #e7a45080;animation:idle 2.8s ease-in-out infinite alternate}.toast{position:absolute;z-index:30;bottom:4%;left:50%;transform:translateX(-50%);padding:10px 18px;background:#071a31ee;border:1px solid #78d1ff;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:90%;text-overflow:ellipsis;overflow:hidden}.toast.show{opacity:1}@media(max-width:700px){.panel-head{height:15%}.panel-body{height:85%}.card-grid{gap:5px}.hero-card .info{padding:3px}.wallet{gap:5px}.battle-layout{grid-template-columns:1.55fr .8fr;gap:5px}.battle-side{gap:4px}.slot{width:29px;height:29px}.btn,.back{padding:.35em .6em;font-size:10px}.notice{padding:4px;margin:4px 0}.stat{padding:3px}.glass{padding:5px;border-radius:8px}}@media(orientation:portrait){#app{min-height:100dvh}#stage{width:100vw;aspect-ratio:16/9}.panel-head{min-height:0}}

const PADS=[[68,65],[210,65],[350,65],[68,205],[210,205],[350,205],[68,345],[210,345],[350,345]];
const ROAD=[[0,130],[140,130],[285,130],[418,130],[418,265],[270,265],[132,265],[25,265],[25,400],[220,400],[480,400]];
const SEG=[];let DIST=0;for(let i=1;i<ROAD.length;i++){let a=ROAD[i-1],b=ROAD[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);SEG.push({a,b,l,start:DIST});DIST+=l}
function pos(d){for(const s of SEG)if(d<=s.start+s.l){let t=Math.max(0,(d-s.start)/s.l);return[s.a[0]+(s.b[0]-s.a[0])*t,s.a[1]+(s.b[1]-s.a[1])*t]}return ROAD.at(-1)}
// V13: independent per-hero procedural animation profiles (no Spine runtime required).
const HERO_MOTION=Array.from({length:12},(_,id)=>({
  phase:id*0.71,breath:2.1+(id%4)*.26,bob:1.6+(id%3)*.65,
  sway:.018+(id%3)*.007,attack: id===1||id===9?'recoil':id===5?'dash':id===2||id===6||id===10?'cast':'lunge',
  glow:['#77cfff','#8affae','#ff9d62','#ffe5a2','#a0ff91','#bc9aff','#92dfff','#ffc36e','#ffda91','#9deaff','#c69cff','#ffe6ba'][id]
}));
function paintHeroMotion(g,img,x,y,id,t,unit,quality){
  const m=HERO_MOTION[id],a=Math.max(0,Math.min(1,(unit.attackFx||0)/.24));
  const cast=Math.max(0,Math.min(1,(unit.cast||0)/.38));
  const beat=t*m.breath+m.phase;
  let dx=0,dy=Math.sin(beat)*m.bob,rotation=Math.sin(beat*.66)*m.sway;
  let scale=1+Math.sin(beat)*.022;
  if(m.attack==='recoil'){dx-=a*7;rotation-=a*.13}
  else if(m.attack==='dash'){dx+=a*9;dy-=a*4;rotation+=a*.17}
  else if(m.attack==='cast'){dy-=a*9;scale+=a*.14}
  else{dx+=a*5;scale+=a*.12}
  g.save();g.translate(x+dx,y+dy);g.rotate(rotation);g.scale(scale,scale);
  g.beginPath();g.arc(0,0,25,0,Math.PI*2);g.clip();g.drawImage(img,-25,-25,50,50);g.restore();
  g.save();g.strokeStyle=m.glow;g.lineWidth=2;g.globalAlpha=.8;g.beginPath();g.arc(x,y,25,0,Math.PI*2);g.stroke();
  if(a>.01){g.globalAlpha=a*.9;g.lineWidth=3;g.beginPath();g.arc(x,y,27+(1-a)*18,0,Math.PI*2);g.stroke()}
  if(cast>.01&&quality!=='low'){
    for(let j=0;j<3;j++){let theta=t*5+j*Math.PI*2/3+m.phase;
      g.globalAlpha=cast*(.55+.3*Math.sin(t*7+j));g.fillStyle=m.glow;
      g.beginPath();g.arc(x+Math.cos(theta)*29,y+Math.sin(theta)*13-8,2.7,0,Math.PI*2);g.fill()}
  }
  g.restore();
}
class Battle{
constructor(canvas,state,notify,onChange){this.c=canvas;this.ctx=canvas.getContext('2d');this.s=state;this.notify=notify;this.onChange=onChange;this.units=Array.isArray(state.formation)&&state.formation.length===9?state.formation.map(v=>Number.isInteger(v)&&state.owned[v]?{id:v,cd:0}:null):Array(9).fill(null);this.enemies=[];this.shots=[];this.particles=[];this.mode='ready';this.energy=0;this.speed=1;this.pick=state.team[0];this.time=0;this.spawnClock=0;this.spawned=0;this.total=0;this.last=0;this.acc=0;this.lastRender=0;this.running=true;this.raf=requestAnimationFrame(t=>this.frame(t));this.c.addEventListener('pointerdown',this.pointer=e=>this.tap(e));this.visibility=()=>{if(document.hidden){this.last=0;this.acc=0;this.paused=true;this.notify('已自动暂停，返回页面后点击继续')} };document.addEventListener('visibilitychange',this.visibility);}
destroy(){this.running=false;cancelAnimationFrame(this.raf);this.c.removeEventListener('pointerdown',this.pointer);document.removeEventListener('visibilitychange',this.visibility)}
select(id){this.pick=id;this.onChange()}
start(){if(this.mode!=='ready')return this.notify('当前无法开启波次');if(!this.units.some(Boolean))return this.notify('先点击战场部署英雄');if(this.s.wave>=15)return;this.mode='fight';this.s.wave++;this.s.inBattle=true;this.spawned=0;this.spawnClock=.3;this.total=this.s.wave%5===0?1:Math.min(36,7+this.s.wave*2);this.enemies=[];this.shots=[];save(this.s);this.notify(this.s.wave%5===0?'⚠ 星蚀巨像降临！':'第 '+this.s.wave+' 波开始');this.onChange()}
tap(e){let r=this.c.getBoundingClientRect(),x=(e.clientX-r.left)*480/r.width,y=(e.clientY-r.top)*440/r.height;let i=PADS.findIndex(p=>Math.hypot(x-p[0],y-p[1])<30);if(i<0)return;if(this.paused){this.paused=false;this.notify('继续战斗');return}if(this.mode!=='ready')return this.notify('战斗期间不能调整阵容');if(this.units[i]){this.units[i]=null;this.s.formation=this.units.map(u=>u?u.id:null);save(this.s);this.notify('已撤回英雄');this.onChange();return}if(this.units.filter(Boolean).length>=9)return;let id=this.pick;if(!this.s.owned[id])return this.notify('尚未获得该英雄');this.units[i]={id,cd:0,attackFx:0,cast:0};this.s.formation=this.units.map(u=>u?u.id:null);save(this.s);this.burst(...PADS[i],'#9fdaff',14);this.notify(HEROES[id].name+' 已部署');this.onChange()}
spawn(){let boss=this.s.wave%5===0,fast=this.spawned%4===2,hp=boss?2600+this.s.wave*330:105+this.s.wave*53;this.enemies.push({id:Math.random(),d:0,hp,max:hp,speed:boss?28:fast?95:42+this.s.wave*1.7,boss,flash:0,slow:0});this.spawned++}

step(dt){this.time+=dt;for(const p of this.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}this.particles=this.particles.filter(p=>p.life>0);if(this.mode!=='fight')return;if(this.spawned<this.total){this.spawnClock-=dt;if(this.spawnClock<=0){this.spawn();this.spawnClock=.62}}for(let i=this.enemies.length-1;i>=0;i--){let e=this.enemies[i];e.slow=Math.max(0,(e.slow||0)-dt);e.d+=e.speed*(e.slow>0?.55:1)*dt;e.flash=Math.max(0,e.flash-dt);if(e.d>=DIST){this.s.hp=Math.max(0,this.s.hp-(e.boss?600:65));this.enemies.splice(i,1);if(this.s.hp<=0){this.mode='lose';this.s.inBattle=false;this.notify('基地失守！可返回主城修复星核');save(this.s);this.onChange()}}}if(this.mode!=='fight')return;for(let i=0;i<9;i++){let u=this.units[i];if(!u)continue;u.attackFx=Math.max(0,(u.attackFx||0)-dt);u.cast=Math.max(0,(u.cast||0)-dt);u.cd-=dt;if(u.cd>0)continue;let h=HEROES[u.id],best=null,dist=-1;for(const e of this.enemies){let p=pos(e.d);if(Math.hypot(p[0]-PADS[i][0],p[1]-PADS[i][1])<=h.range+this.s.tech.range*8&&e.d>dist){best=e;dist=e.d}}if(!best)continue;let p=pos(best.d),lv=this.s.owned[u.id]?.level||1,star=this.s.owned[u.id]?.stars||1,damage=h.atk*(1+.12*(lv-1)+.22*(star-1)+.15*this.s.tech.attack);u.attackFx=.24;u.cast=.38;this.shots.push({x:PADS[i][0],y:PADS[i][1],tx:p[0],ty:p[1],id:best.id,damage,hero:u.id,life:.17});u.cd=h.role==='射手'?.52:h.role==='刺客'?.47:.78;this.energy=Math.min(100,this.energy+2+this.s.tech.energy*.4);if(u.id===10){for(const z of this.enemies)if(z!==best&&Math.abs(z.d-best.d)<80)z.hp-=damage*.18}if(u.id===11&&Math.random()<.22)best.slow=1.2}for(let i=this.shots.length-1;i>=0;i--){let p=this.shots[i];p.life-=dt;if(p.life<=0){let e=this.enemies.find(x=>x.id===p.id);if(e){e.hp-=p.damage;e.flash=.1;let q=pos(e.d);this.burst(q[0],q[1],p.hero===2?'#ffaf6d':'#8ccaff',4);if(p.hero===6)e.slow=1.7;if(p.hero===5)e.hp-=p.damage*.25;if(p.hero===9)e.hp-=p.damage*.3;if(p.hero===2||p.hero===6){for(const z of this.enemies)if(z!==e&&Math.abs(z.d-e.d)<65)z.hp-=p.damage*.3}if(p.hero===3||p.hero===7)this.s.hp=Math.min(1200,this.s.hp+1.5)}this.shots.splice(i,1)}}for(let i=this.enemies.length-1;i>=0;i--){let e=this.enemies[i];if(e.hp<=0){let p=pos(e.d);this.burst(...p,e.boss?'#ffd58a':'#ff8eaa',e.boss?55:12);this.s.gold+=e.boss?650:35;this.s.kills++;this.enemies.splice(i,1)}}if(this.spawned>=this.total&&!this.enemies.length){this.mode=this.s.wave>=15?'win':'ready';this.s.inBattle=false;this.s.gold+=160+this.s.wave*25;this.s.gems+=this.s.wave%5===0?180:20;save(this.s);this.notify(this.mode==='win'?'🏆 恭喜通关全部 15 波！':'第 '+this.s.wave+' 波胜利！');this.onChange()}}
draw(){const g=this.ctx;let t=this.time;let bg=g.createLinearGradient(0,0,480,440);bg.addColorStop(0,'#183762');bg.addColorStop(1,'#070f25');g.fillStyle=bg;g.fillRect(0,0,480,440);g.strokeStyle='#79c6ff12';for(let x=0;x<480;x+=25)for(let y=0;y<440;y+=25)g.strokeRect(x,y,25,25);g.lineCap='round';g.lineJoin='round';g.beginPath();ROAD.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.strokeStyle='#466d93';g.lineWidth=45;g.stroke();g.strokeStyle='#10233d';g.lineWidth=35;g.stroke();g.strokeStyle='#60b6e0';g.lineWidth=2;g.setLineDash([8,14]);g.lineDashOffset=-t*28;g.stroke();g.setLineDash([]);
for(let i=0;i<9;i++){let p=PADS[i],u=this.units[i];g.save();g.shadowColor='#6cbbff';g.shadowBlur=12;g.beginPath();g.ellipse(p[0],p[1]+13,31,15,0,0,7);g.fillStyle='#214b73';g.fill();g.strokeStyle='#7bcaff';g.lineWidth=2;g.stroke();g.restore();if(!u){g.fillStyle='#a9e6ff';g.font='bold 28px sans-serif';g.textAlign='center';g.fillText('+',p[0],p[1]+6)}else{let img=this.images?.[u.id];if(img?.complete&&img.naturalWidth){paintHeroMotion(g,img,p[0],p[1]-4,u.id,t,u,this.s.settings.quality)}else{g.fillStyle='#e7d2ff';g.font='26px sans-serif';g.fillText('✦',p[0],p[1])}}}
for(const e of this.enemies){let [x,y]=pos(e.d),r=e.boss?28:14;g.save();g.shadowBlur=15;g.shadowColor=e.boss?'#ff8acb':'#ff7e8c';g.fillStyle=e.flash?'#fff':e.boss?'#8841a0':'#a94771';g.beginPath();for(let j=0;j<6;j++){let a=t*.7+j*Math.PI/3;j?g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):g.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}g.closePath();g.fill();g.restore();g.fillStyle='#481e35';g.fillRect(x-r,y-r-15,r*2,5);g.fillStyle=e.boss?'#ffb17a':'#88e7b5';g.fillRect(x-r,y-r-15,r*2*Math.max(0,e.hp/e.max),5)}for(const p of this.shots){let q=Math.max(0,1-p.life/.17);g.strokeStyle=['#75caff','#9cffb3','#ff9e65','#ffe4a8','#a0ff8a','#b99aff','#9cddff','#ffbb70','#ffe4a8','#b4e6ff','#d7a5ff','#f9db9e'][p.hero]||'#a6e7ff';g.shadowColor=g.strokeStyle;g.shadowBlur=10;g.lineWidth=3;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+(p.tx-p.x)*q,p.y+(p.ty-p.y)*q);g.stroke();g.shadowBlur=0}for(const p of this.particles){g.globalAlpha=Math.min(1,p.life*2);g.fillStyle=p.color;g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1;g.fillStyle='#b3f4ff';g.font='bold 12px sans-serif';g.textAlign='left';g.fillText('星核基地 ◆',370,430);if(this.mode==='win'||this.mode==='lose'){g.fillStyle='#061126e0';g.fillRect(0,165,480,110);g.fillStyle=this.mode==='win'?'#ffe0a4':'#ff9cae';g.textAlign='center';g.font='bold 31px sans-serif';g.fillText(this.mode==='win'?'★ 全部通关 ★':'基地失守',240,225)}}

function updateBattle(){if(!battle||page!=='battle')return;let b=battle;$('battleStats').innerHTML=`<b>第 ${s.wave}/15 波</b><div>♥ 星核 ${Math.ceil(s.hp)}/1200</div><div>⚡ 能量 ${Math.floor(b.energy)}%</div><div>敌人 ${b.enemies.length+b.total-b.spawned}</div><div>状态 ${b.paused?'已暂停':b.mode==='ready'?'准备':b.mode==='fight'?'战斗中':b.mode==='win'?'已通关':'失败'}</div>`;$('battleTeam').innerHTML=s.team.map(id=>`<button class="slot ${b.pick===id?'active':''}" data-action="pickBattle" data-id="${id}" title="${HEROES[id].name}">${portrait(id)}</button>`).join('');let start=document.querySelector('[data-action="startWave"]');if(start)start.disabled=b.mode!=='ready';let skill=document.querySelector('[data-action="useSkill"]');if(skill)skill.disabled=b.mode!=='fight'||b.energy<100}
function draw(n){if(s.gems<200*n-(n===10?200:0))return notify('星钻不足，前往活动领取补给');s.gems-=n===10?1800:200;for(let i=0;i<n;i++){let r=Math.random(),id=r<.55?Math.floor(Math.random()*4):r<.83?4+Math.floor(Math.random()*4):r<.97?8+Math.floor(Math.random()*2):10+Math.floor(Math.random()*2);if(s.owned[id])s.inventory.shards+=2;else s.owned[id]={stars:1,level:1};s.lastDraw=id;s.draws++}notify('招募完成！最后获得 '+HEROES[s.lastDraw].name);sync();render()}
function act(a,id){if(a==='restorePower'){if(s.power>=120)return notify('体力已满');if(s.gems<60)return notify('星钻不足，无法补充体力');if(!confirm('消耗 60 星钻恢复最多 60 点体力？'))return;s.gems-=60;s.power=Math.min(120,s.power+60);notify('体力补充成功');sync();return}if(a==='selectHero'){choice=+id;render();return}if(a==='pickBattle'){battle?.select(+id);return}if(a==='startWave'){battle?.start();return}if(a==='useSkill'){battle?.skill();return}if(a==='speed'){if(battle){battle.speed=battle.speed===1?2:1;notify('战斗速度 '+battle.speed+'×')}return}if(a==='pauseBattle'){if(battle){battle.paused=!battle.paused;battle.last=0;notify(battle.paused?'战斗已暂停':'继续战斗')}return}if(a==='goHome'){open('home');return}if(a==='goBattle'){open('battle');return}if(a==='goGacha'){open('gacha');return}if(a==='draw1'||a==='draw10'){draw(a==='draw10'?10:1);return}if(a==='addTeam'||a==='addTeamCard'){let v=a==='addTeam'?choice:+id;if(!s.owned[v])return notify('尚未获得');if(s.team.includes(v))return notify('已在编队中');if(s.team.length>=6)return notify('编队最多 6 人');s.team.push(v);notify('已加入编队');sync();render();return}if(a==='removeTeam'){if(s.team.length===1)return notify('至少保留一名英雄');s.team=s.team.filter(x=>x!==+id);sync();render();return}if(a==='levelUp'){let o=s.owned[choice];if(!o)return;if(s.gold<100*o.level)return notify('金币不足');s.gold-=100*o.level;o.level++;notify('升级成功');sync();render();return}if(a==='starUp'){let o=s.owned[choice];if(!o||o.stars>=5)return notify('已达到最高星级');if(s.inventory.shards<3)return notify('碎片不足');s.inventory.shards-=3;o.stars++;notify('突破成功');sync();render();return}if(a==='skillUp'){if(s.gold<250)return notify('金币不足');s.gold-=250;s.tech.attack++;notify('技能攻击力提升');sync();render();return}if(a.startsWith('tech_')){let key=a.slice(5);if(s.gold<300)return notify('金币不足');s.gold-=300;s.tech[key]++;notify('科技升级成功');sync();render();return}if(a==='repair'){if(s.gold<200)return notify('金币不足');if(s.hp>=1200)return notify('基地已满血');s.gold-=200;s.hp=Math.min(1200,s.hp+400);if(battle?.mode==='lose'){battle.mode='ready';s.inBattle=false;battle.enemies=[];battle.spawned=0;battle.total=0;s.wave=Math.max(0,s.wave-1)}notify('基地修复成功');sync();render();return}if(a==='supply'){s.gold+=500;s.gems+=100;notify('补给领取成功');sync();render();return}if(a==='buyGems'){if(s.gold<300)return notify('金币不足');s.gold-=300;s.gems+=150}if(a==='buyGold'){if(s.gems<200)return notify('星钻不足');s.gems-=200;s.gold+=600}if(a==='buyShards'){if(s.gems<100)return notify('星钻不足');s.gems-=100;s.inventory.shards+=3}if(a==='buyCore'){if(s.gold<250)return notify('金币不足');s.gold-=250;s.inventory.core++}if(a.startsWith('buy')){notify('购买成功');sync();render();return}if(a.startsWith('claimMission')){let i=+a.replace('claimMission',''),m=MISSIONS[i];if(s.claimed.includes(i))return notify('已领取');if(s.wave<m[1])return notify('尚未完成');s.claimed.push(i);s.gold+=m[2];notify('奖励领取成功');sync();render();return}if(a==='claimMail'){if(s.mailClaimed)return notify('已领取');s.mailClaimed=true;s.gold+=500;s.gems+=300;notify('就任礼领取成功');sync();render();return}if(a==='toggleSound'){s.settings.sound=!s.settings.sound;sync();render();return}if(a==='toggleQuality'){s.settings.quality=s.settings.quality==='high'?'low':'high';sync();render();return}if(a==='exportSave'){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='starcore-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return}if(a==='importSave'){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{let v=JSON.parse(await input.files[0].text());if(!v.owned||!v.team)throw Error();s={...s,...v};sync();render();notify('导入成功')}catch(e){notify('存档格式无效')}};input.click();return}if(a==='resetGame'){if(!confirm('确定清空全部游戏进度吗？'))return;localStorage.removeItem('starcore-v12');location.reload()}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){open(nav.dataset.page);return}let b=e.target.closest('[data-action]');if(b){act(b.dataset.action,b.dataset.id)}});$('back').onclick=()=>open('home');window.addEventListener('error',e=>{console.error(e.error||e.message);notify('运行错误：'+String(e.message).slice(0,80))});window.addEventListener('unhandledrejection',e=>notify('加载错误：'+String(e.reason).slice(0,80)));sync();
</script></body></html>
